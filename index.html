<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo/asson_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      window.addEventListener('load', function () {
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) {
            var content = viewport.getAttribute('content') || '';
            if (content.indexOf('maximum-scale=') === -1) {
              viewport.setAttribute(
                'content',
                content + ', maximum-scale=1, user-scalable=no'
              );
            }
          }
        }
      });
    </script>
    <meta name="description" content="Official Academic Resource Hub, Past Examination Questions, Course Outlines and Announcements for Statistics Students, University of Ibadan." />
    <link rel="canonical" href="https://asson-ui.vercel.app/" />
    <title>ASSON UI — Together for Academic Excellence</title>
    
    <!-- Open Graph / WhatsApp / Telegram Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://asson-ui.vercel.app/" />
    <meta property="og:site_name" content="ASSON UI" />
    <meta property="og:title" content="ASSON UI — Academic Resource Hub & Past Questions Archive" />
    <meta property="og:description" content="Official academic library, past examination questions, study notes, notices and opportunities for Statistics students, University of Ibadan." />
    <meta property="og:image" content="https://asson-ui.vercel.app/logo/asson_logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ASSON UI — Academic Resource Hub" />
    <meta name="twitter:description" content="Verified past questions, lecture notes, departmental notices and scholarships for Statistics students at University of Ibadan." />
    <meta name="twitter:image" content="https://asson-ui.vercel.app/logo/asson_logo.png" />
    
    <!-- PWA Web App Manifest & Mobile OS Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#087A3E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1115" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASSON UI" />
    <meta name="application-name" content="ASSON UI" />
    <meta name="msapplication-TileColor" content="#087A3E" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface-bg text-text-main antialiased font-sans selection:bg-brand-light selection:text-brand-deep">
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F6F8F7;font-family:'Inter',system-ui,-apple-system,sans-serif;z-index:99999;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <img src="/logo/asson_logo.webp" alt="ASSON UI" width="64" height="64" style="width:64px;height:64px;object-fit:contain;animation:loaderPulse 1.8s ease-in-out infinite;" />
        </div>
        <div style="font-weight:800;font-size:16px;color:#064B2B;letter-spacing:-0.02em;margin-bottom:6px;">
          ASSON UI
        </div>
        <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:#5C6B75;font-weight:500;">
          <span>Loading academic resources</span>
          <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div style="width:130px;height:3px;background:#E2E8F0;border-radius:9999px;margin-top:16px;overflow:hidden;position:relative;">
          <div style="width:40%;height:100%;background:#087A3E;border-radius:9999px;position:absolute;animation:loaderIndeterminate 1.4s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.9; }
          }
          @keyframes loaderIndeterminate {
            0% { left: -40%; width: 30%; }
            50% { left: 35%; width: 50%; }
            100% { left: 100%; width: 30%; }
          }
          .loading-dots span {
            animation: dotBlink 1.4s infinite both;
          }
          .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
          .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
          @keyframes dotBlink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
          }
          @media (prefers-reduced-motion: reduce) {
            #initial-loader *,
            #initial-loader .loading-dots span {
              animation: none !important;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
